name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (migrate + smoke test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sitego
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: sitego
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: ci_secret_ci_secret_ci_secret_123456
      JWT_REFRESH_SECRET: ci_refresh_ci_refresh_ci_refresh_12
      AI_MODEL_ENABLED: "false"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install
        run: npm ci
      - name: Migrate
        run: npm run migrate
      - name: Migrate again (must be idempotent)
        run: npm run migrate
      - name: Seed
        run: npm run seed
      - name: Smoke test
        run: |
          node server.js &
          sleep 8
          curl --fail http://localhost:5000/api/health

  frontend:
    name: Frontend (web export)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci --legacy-peer-deps
      - name: Export web build
        run: npx expo export --platform web
